="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Volume&quot;, &quot;defaultValue&quot;: 0.4, &quot;maxValue&quot;: 1, &quot;step&quot;: 0.01, &quot;formatOptions&quot;: {&quot;style&quot;: &quot;percent&quot;}, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><span class="nk-matrix__row">Currency</span><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Budget ceiling&quot;, &quot;defaultValue&quot;: 40000, &quot;maxValue&quot;: 100000, &quot;step&quot;: 1000, &quot;formatOptions&quot;: {&quot;style&quot;: &quot;currency&quot;, &quot;currency&quot;: &quot;INR&quot;, &quot;maximumFractionDigits&quot;: 0}, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}}}" style="display:contents"></span></div><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Budget ceiling&quot;, &quot;defaultValue&quot;: 40000, &quot;maxValue&quot;: 100000, &quot;step&quot;: 1000, &quot;formatOptions&quot;: {&quot;style&quot;: &quot;currency&quot;, &quot;currency&quot;: &quot;INR&quot;, &quot;maximumFractionDigits&quot;: 0}, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Budget ceiling&quot;, &quot;defaultValue&quot;: 40000, &quot;maxValue&quot;: 100000, &quot;step&quot;: 1000, &quot;formatOptions&quot;: {&quot;style&quot;: &quot;currency&quot;, &quot;currency&quot;: &quot;INR&quot;, &quot;maximumFractionDigits&quot;: 0}, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}, &quot;forceState&quot;: &quot;focus&quot;}}" style="display:contents"></span></div><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Budget ceiling&quot;, &quot;defaultValue&quot;: 40000, &quot;maxValue&quot;: 100000, &quot;step&quot;: 1000, &quot;formatOptions&quot;: {&quot;style&quot;: &quot;currency&quot;, &quot;currency&quot;: &quot;INR&quot;, &quot;maximumFractionDigits&quot;: 0}, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}, &quot;forceState&quot;: &quot;dragging&quot;}}" style="display:contents"></span></div><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Budget ceiling&quot;, &quot;defaultValue&quot;: 40000, &quot;maxValue&quot;: 100000, &quot;step&quot;: 1000, &quot;formatOptions&quot;: {&quot;style&quot;: &quot;currency&quot;, &quot;currency&quot;: &quot;INR&quot;, &quot;maximumFractionDigits&quot;: 0}, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><span class="nk-matrix__row">Clock time</span><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Playback position&quot;, &quot;defaultValue&quot;: 83, &quot;maxValue&quot;: 220, &quot;formatValue&quot;: &quot;$fn:clock&quot;, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}}}" style="display:contents"></span></div><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Playback position&quot;, &quot;defaultValue&quot;: 83, &quot;maxValue&quot;: 220, &quot;formatValue&quot;: &quot;$fn:clock&quot;, &quot;styles&quot;: {&quot;width&quot;: &quot;100%&quot;}, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div style="width:13rem"><span data-nk="{&quot;$c&quot;: &quot;Slider&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Playback position&quot;, &quot;defaultValue&quot;: 83, &quot;maxValue&quot;: 220, &quot;formatValue&quot;: &quot;$fn:clock&quot; <script data-nk-fn>window.NK_FN = { clock: function (s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " of 3:40"; } };</script>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   "$fn:name" the function window.NK_FN.name (a card defines its own in a <script data-nk-fn> above this one),
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (typeof v === 'string' && v.indexOf('$fn:') === 0) return (window.NK_FN || {})[v.slice(4)]; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); if (v.$html) return h('div', { style: { height: '100%' }, dangerouslySetInnerHTML: { __html: v.$html } }); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
