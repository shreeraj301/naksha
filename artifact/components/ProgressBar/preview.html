<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProgressBar · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-grid" style="grid-template-columns:repeat(2,minmax(240px,320px))"><div class="nk-cell"><span class="nk-cap">Determinate</span><span data-nk="{&quot;$c&quot;: &quot;ProgressBar&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading the paper&quot;, &quot;value&quot;: 42}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Complete</span><span data-nk="{&quot;$c&quot;: &quot;ProgressBar&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading the paper&quot;, &quot;value&quot;: 100}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Indeterminate</span><span data-nk="{&quot;$c&quot;: &quot;ProgressBar&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Uploading&quot;, &quot;isIndeterminate&quot;: true}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Compact</span><span data-nk="{&quot;$c&quot;: &quot;ProgressBar&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Storage used&quot;, &quot;value&quot;: 68, &quot;isCompact&quot;: true}}" style="display:contents"></span></div></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); if (v.$html) return h('div', { style: { height: '100%' }, dangerouslySetInnerHTML: { __html: v.$html } }); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
