<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProgressBar · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-grid" style="grid-template-columns:repeat(2,minmax(240px,320px))"><div class="nk-cell"><span class="nk-cap">Determinate</span><div class="nk-progress" role="progressbar" aria-label="Reading the paper" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100"><div class="nk-progress__head"><span>Reading the paper</span><span class="nk-num">42%</span></div><div class="nk-progress__track"><div class="nk-progress__bar" style="width:42%"></div></div></div></div><div class="nk-cell"><span class="nk-cap">Complete</span><div class="nk-progress" role="progressbar" aria-label="Reading the paper" aria-valuenow="100"><div class="nk-progress__head"><span>Reading the paper</span><span class="nk-num">100%</span></div><div class="nk-progress__track"><div class="nk-progress__bar" style="width:100%"></div></div></div></div><div class="nk-cell"><span class="nk-cap">Indeterminate</span><div class="nk-progress nk-progress--indeterminate" role="progressbar" aria-label="Uploading"><div class="nk-progress__head"><span>Uploading</span></div><div class="nk-progress__track"><div class="nk-progress__bar"></div></div></div></div><div class="nk-cell"><span class="nk-cap">Compact</span><div class="nk-progress" role="progressbar" aria-valuenow="68" aria-label="Storage used"><div class="nk-progress__track"><div class="nk-progress__bar" style="width:68%"></div></div></div></div></div></div>

</body>
</html>
