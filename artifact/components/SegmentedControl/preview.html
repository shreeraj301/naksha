<!doctype html>

<meta charset="utf-8">
<title>SegmentedControl · preview</title>

<body>
<div class="nk-stage"><div class="nk-row"><div class="nk-cell"><span class="nk-cap">Two</span><span data-nk="{&quot;$c&quot;: &quot;SegmentedControl&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;View&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;human&quot;, &quot;label&quot;: &quot;Human&quot;}, {&quot;id&quot;: &quot;agent&quot;, &quot;label&quot;: &quot;Agent&quot;}], &quot;defaultValue&quot;: &quot;human&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Three</span><span data-nk="{&quot;$c&quot;: &quot;SegmentedControl&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;View&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;defaultValue&quot;: &quot;everyday&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Four, hover</span><span data-nk="{&quot;$c&quot;: &quot;SegmentedControl&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;View&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;day&quot;, &quot;label&quot;: &quot;Day&quot;}, {&quot;id&quot;: &quot;week&quot;, &quot;label&quot;: &quot;Week&quot;}, {&quot;id&quot;: &quot;month&quot;, &quot;label&quot;: &quot;Month&quot;}, {&quot;id&quot;: &quot;year&quot;, &quot;label&quot;: &quot;Year&quot;}], &quot;defaultValue&quot;: &quot;day&quot;, &quot;forceState&quot;: {&quot;hover&quot;: &quot;month&quot;}}}" style="display:contents"></span></div></div><div class="nk-row"><div class="nk-cell"><span class="nk-cap">Quiet, inside a toolbar</span><span data-nk="{&quot;$c&quot;: &quot;SegmentedControl&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;View&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;human&quot;, &quot;label&quot;: &quot;Human&quot;}, {&quot;id&quot;: &quot;agent&quot;, &quot;label&quot;: &quot;Agent&quot;}], &quot;defaultValue&quot;: &quot;human&quot;, &quot;variant&quot;: &quot;quiet&quot;}}" style="display:contents"></span></div></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object' && v.$c) return el(v); return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
