<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast · preview</title>

</head>
<body>
<div class="nk-stage" style="gap:12px;align-items:flex-start"><span data-nk="{&quot;$c&quot;: &quot;Toaster&quot;, &quot;p&quot;: {&quot;preview&quot;: {&quot;layout&quot;: &quot;list&quot;, &quot;toasts&quot;: [{&quot;message&quot;: &quot;Link copied&quot;}, {&quot;message&quot;: &quot;Subscription cancelled&quot;, &quot;tone&quot;: &quot;success&quot;, &quot;action&quot;: {&quot;label&quot;: &quot;Undo&quot;, &quot;onPress&quot;: &quot;$noop&quot;}}, {&quot;message&quot;: &quot;Could not send. Check your connection.&quot;, &quot;tone&quot;: &quot;danger&quot;, &quot;action&quot;: {&quot;label&quot;: &quot;Retry&quot;, &quot;onPress&quot;: &quot;$noop&quot;}}]}}}" style="display:contents"></span><div style="margin-top:12px;width:100%"><span class="nk-cap">Stacked, newest in front · hover spreads them 8 apart</span><span data-nk="{&quot;$c&quot;: &quot;Toaster&quot;, &quot;p&quot;: {&quot;preview&quot;: {&quot;layout&quot;: &quot;stack&quot;, &quot;toasts&quot;: [{&quot;message&quot;: &quot;Saved to your notes&quot;}, {&quot;message&quot;: &quot;Link copied&quot;}, {&quot;message&quot;: &quot;Subscription cancelled&quot;, &quot;tone&quot;: &quot;success&quot;, &quot;action&quot;: {&quot;label&quot;: &quot;Undo&quot;, &quot;onPress&quot;: &quot;$noop&quot;}}]}}}" style="display:contents"></span></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
