<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shreeraj Narwade</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-canvas); color:var(--fg-default); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .ink { fill:var(--fg-default); } .read { fill:var(--section-read); } .build { fill:var(--section-build); }
  .pause { fill:var(--section-pause); } .play { fill:var(--section-play); } .plug { fill:var(--section-plug); }
  .reg { stroke:var(--border-strong); stroke-width:1; fill:none; }
  .rule { stroke:var(--border-strong); stroke-width:1; }
  .words { position:absolute; left:var(--space-40); bottom:var(--space-40); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:800; font-size:112px; line-height:0.9; letter-spacing:-0.015em; color:var(--fg-default); }
  .tag { margin:var(--space-12) 0 0 3px; font-size:14px; line-height:20px; color:var(--fg-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      fg-default slab 144x272 bled off the top (ink: the system is paper and ink) · section-build 144x144 · section-read 96x192 · section-pause 96x72 · section-play 48x48 · section-plug 24x24 (agents, kept small) ≈ 33% of 960x320
  arrangement a strip of sheets on one baseline (y 248, space-48 above the bottom edge), space-24 gutters, like drawings pinned in a row
  pattern     registration crosses, from "a precise, technical, drafting" system: 8px plus marks at a space-48 diagonal pitch on the ground only
  scales      every side a multiple of space-24; gutters space-24; pitch space-24 / space-48; corners radius-control (0) everywhere
-->

</div>
