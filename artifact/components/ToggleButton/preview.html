uot;icon&quot;: &quot;eye&quot;, &quot;label&quot;: &quot;Show hidden items&quot;, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;icon&quot;: &quot;eye&quot;, &quot;label&quot;: &quot;Show hidden items&quot;, &quot;defaultSelected&quot;: true}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;icon&quot;: &quot;eye&quot;, &quot;label&quot;: &quot;Show hidden items&quot;, &quot;defaultSelected&quot;: true, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;icon&quot;: &quot;eye&quot;, &quot;label&quot;: &quot;Show hidden items&quot;, &quot;defaultSelected&quot;: true, &quot;forceState&quot;: &quot;focus&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;icon&quot;: &quot;eye&quot;, &quot;label&quot;: &quot;Show hidden items&quot;, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;icon&quot;: &quot;eye&quot;, &quot;label&quot;: &quot;Show hidden items&quot;, &quot;defaultSelected&quot;: true, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><span class="nk-matrix__row">Small</span><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;, &quot;defaultSelected&quot;: true}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;, &quot;defaultSelected&quot;: true, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;, &quot;defaultSelected&quot;: true, &quot;forceState&quot;: &quot;focus&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;ToggleButton&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Approved only&quot;, &quot;size&quot;: &quot;sm&quot;, &quot;defaultSelected&quot;: true, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); if (v.$html) return h('div', { style: { height: '100%' }, dangerouslySetInnerHTML: { __html: v.$html } }); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
