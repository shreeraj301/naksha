<title>Alert · preview</title>

</head>
<body>
<div class="nk-stage" style="gap:12px"><span data-nk="{&quot;$c&quot;: &quot;Alert&quot;, &quot;p&quot;: {&quot;tone&quot;: &quot;info&quot;, &quot;title&quot;: &quot;Saved on this device&quot;, &quot;children&quot;: &quot;Your draft stays in this browser until you sign in.&quot;, &quot;onDismiss&quot;: &quot;$noop&quot;}}" style="display:contents"></span><span data-nk="{&quot;$c&quot;: &quot;Alert&quot;, &quot;p&quot;: {&quot;tone&quot;: &quot;success&quot;, &quot;title&quot;: &quot;Change agreed&quot;, &quot;children&quot;: &quot;Both of you signed. The new rent applies from 1 January.&quot;, &quot;onDismiss&quot;: &quot;$noop&quot;, &quot;action&quot;: {&quot;label&quot;: &quot;View the agreement&quot;, &quot;href&quot;: &quot;#&quot;}}}" style="display:contents"></span><span data-nk="{&quot;$c&quot;: &quot;Alert&quot;, &quot;p&quot;: {&quot;tone&quot;: &quot;warning&quot;, &quot;title&quot;: &quot;Renews in 3 days&quot;, &quot;children&quot;: &quot;Your cloud storage plan renews on 18 December for ₹130.&quot;, &quot;onDismiss&quot;: &quot;$noop&quot;}}" style="display:contents"></span><span data-nk="{&quot;$c&quot;: &quot;Alert&quot;, &quot;p&quot;: {&quot;tone&quot;: &quot;danger&quot;, &quot;title&quot;: &quot;Could not read this file&quot;, &quot;children&quot;: &quot;Try a PDF under 10 MB, or paste the text instead.&quot;, &quot;onDismiss&quot;: &quot;$noop&quot;, &quot;action&quot;: {&quot;label&quot;: &quot;Paste text instead&quot;, &quot;href&quot;: &quot;#&quot;}}}" style="display:contents"></span><span data-nk="{&quot;$c&quot;: &quot;Alert&quot;, &quot;p&quot;: {&quot;tone&quot;: &quot;neutral&quot;, &quot;title&quot;: &quot;Everyday reading level&quot;, &quot;children&quot;: &quot;Explanations use plain words. Switch to Informed to keep the legal terms.&quot;, &quot;onDismiss&quot;: &quot;$noop&quot;}}" style="display:contents"></span></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); if (v.$html) return h('div', { style: { height: '100%' }, dangerouslySetInnerHTML: { __html: v.$html } }); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
