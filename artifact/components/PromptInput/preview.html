pdf&quot;, &quot;meta&quot;: &quot;4 pages&quot;}], &quot;onRemoveAttachment&quot;: &quot;$noop&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Streaming: send becomes stop</span><span data-nk="{&quot;$c&quot;: &quot;PromptInput&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Message garu&quot;, &quot;placeholder&quot;: &quot;Ask garu about this paper&quot;, &quot;onAddFiles&quot;: &quot;$noop&quot;, &quot;onDictate&quot;: &quot;$noop&quot;, &quot;level&quot;: {&quot;$c&quot;: &quot;PromptLevel&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Everyday&quot;}}, &quot;note&quot;: &quot;garu can be wrong. Check the sources.&quot;, &quot;defaultValue&quot;: &quot;Explain clause 4.2 like I have never signed a lease before.&quot;, &quot;isGenerating&quot;: true, &quot;onStop&quot;: &quot;$noop&quot;}}" style="display:contents"></span></div><span class="nk-cap">Spec · 8 around everything · text and icon glyphs share one 16 left edge · every control 32</span><div class="nk-spec" style="padding:28px 48px 34px 44px;width:100%;max-width:780px"><span data-nk="{&quot;$c&quot;: &quot;PromptInput&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Message garu&quot;, &quot;placeholder&quot;: &quot;Ask garu about this paper&quot;, &quot;onAddFiles&quot;: &quot;$noop&quot;, &quot;onDictate&quot;: &quot;$noop&quot;, &quot;level&quot;: {&quot;$c&quot;: &quot;PromptLevel&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Everyday&quot;}}, &quot;note&quot;: null, &quot;showKeyHint&quot;: false}, &quot;spec&quot;: &quot;h,pl,pr,pt,pb&quot;, &quot;specTarget&quot;: &quot;.nk-prompt__box&quot;}" style="display:contents"></span></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object' && v.$c) return el(v); return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
<script>
function snSpec(wrap){
  var el = wrap.querySelector('[data-spec]'); if(!el) return;
  wrap.querySelectorAll('.nk-dim,.nk-pad').forEach(function(n){n.remove();});
  var W = wrap.getBoundingClientRect(), r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  var x0 = r.left - W.left, y0 = r.top - W.top, round = function(v){return Math.round(v*10)/10;};
  function dim(cls, st, label){ var d=document.createElement('span'); d.className='nk-dim '+cls+((st.width!==undefined && st.width<26)?' is-narrow':''); for(var k in st) d.style[k]=st[k]+'px'; d.innerHTML='<b>'+label+'</b>'; wrap.appendChild(d); }
  function pad(st){ var d=document.createElement('span'); d.className='nk-pad'; for(var k in st) d.style[k]=st[k]+'px'; wrap.appendChild(d); }
  var want = (el.getAttribute('data-spec')||'h,pl,pr,gap').split(',');
  var pl=parseFloat(cs.paddingLeft), pr=parseFloat(cs.paddingRight), pt=parseFloat(cs.paddingTop), pb=parseFloat(cs.paddingBottom);
  if(want.indexOf('h')>-1) dim('nk-dim--v is-left', {left:x0-14, top:y0, height:r.height}, round(r.height));
  if(want.indexOf('w')>-1) dim('nk-dim--h', {left:x0, top:y0-14, width:r.width}, round(r.width));
  if(want.indexOf('pl')>-1 && pl){ pad({left:x0, top:y0, width:pl, height:r.height}); dim('nk-dim--h', {left:x0, top:y0+r.height+12, width:pl}, round(pl)); }
  if(want.indexOf('pr')>-1 && pr){ pad({left:x0+r.width-pr, top:y0, width:pr, height:r.height}); dim('nk-dim--h', {left:x0+r.width-pr, top:y0+r.height+12, width:pr}, round(pr)); }
  if(want.indexOf('pt')>-1 && pt){ pad({left:x0, top:y0, width:r.width, height:pt}); dim('nk-dim--v', {left:x0+r.width+12, top:y0, height:pt}, round(pt)); }
  if(want.indexOf('pb')>-1 && pb){ pad({left:x0, top:y0+r.height-pb, width:r.width, height:pb}); dim('nk-dim--v', {left:x0+r.width+12, top:y0+r.height-pb, height:pb}, round(pb)); }
  if(want.indexOf('gap')>-1){ var kids=[].filter.call(el.children,function(c){return c.offsetParent!==null && getComputedStyle(c).position!=='absolute';});
    if(kids.length>1){ var a=kids[0].getBoundingClientRect(), b=kids[1].getBoundingClientRect(); var g=b.left-a.right; if(g>0) dim('nk-dim--h is-above', {left:a.right-W.left, top:y0-12, width:g}, round(g)); } }
}
function snSpecAll(){ document.querySelectorAll('.nk-spec').forEach(snSpec); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){ snSpecAll(); setTimeout(snSpecAll, 120); });
window.addEventListener('resize', snSpecAll);
</script>
