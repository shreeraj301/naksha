<body>
<div class="nk-stage nk-scrim" style="padding:40px;flex-direction:row;flex-wrap:wrap;justify-content:space-between;gap:24px"><div style="height:480px"><span data-nk="{&quot;$c&quot;: &quot;Drawer&quot;, &quot;p&quot;: {&quot;isInline&quot;: true, &quot;side&quot;: &quot;start&quot;, &quot;isDismissable&quot;: true, &quot;title&quot;: &quot;Index&quot;, &quot;children&quot;: {&quot;$html&quot;: &quot;&lt;ul style=\&quot;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px\&quot;&gt;&lt;li&gt;&lt;a class=\&quot;nk-link\&quot; href=\&quot;#\&quot;&gt;Overview&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=\&quot;nk-link\&quot; href=\&quot;#\&quot;&gt;Floor plans&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=\&quot;nk-link\&quot; href=\&quot;#\&quot;&gt;Materials&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=\&quot;nk-link\&quot; href=\&quot;#\&quot;&gt;Budget&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=\&quot;nk-link\&quot; href=\&quot;#\&quot;&gt;Notes&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&quot;}}}" style="display:contents"></span></div><div style="height:480px"><span data-nk="{&quot;$c&quot;: &quot;Drawer&quot;, &quot;p&quot;: {&quot;isInline&quot;: true, &quot;title&quot;: &quot;New project&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;Input&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Project name&quot;, &quot;placeholder&quot;: &quot;Kitchen renovation&quot;, &quot;description&quot;: &quot;You can rename it later.&quot;}}, &quot;footer&quot;: [{&quot;$c&quot;: &quot;Button&quot;, &quot;p&quot;: {&quot;variant&quot;: &quot;secondary&quot;, &quot;children&quot;: &quot;Cancel&quot;}}, {&quot;$c&quot;: &quot;Button&quot;, &quot;p&quot;: {&quot;variant&quot;: &quot;primary&quot;, &quot;children&quot;: &quot;Create project&quot;}}]}}" style="display:contents"></span></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); if (v.$html) return h('div', { style: { height: '100%' }, dangerouslySetInnerHTML: { __html: v.$html } }); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
