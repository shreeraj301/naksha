<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tooltip · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-row" style="gap:48px;align-items:flex-start"><div class="nk-cell"><span class="nk-cap">Label</span><span data-nk="{&quot;$c&quot;: &quot;Tooltip&quot;, &quot;p&quot;: {&quot;content&quot;: &quot;Copy link&quot;, &quot;isInline&quot;: true}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">With shortcut</span><span data-nk="{&quot;$c&quot;: &quot;Tooltip&quot;, &quot;p&quot;: {&quot;content&quot;: &quot;Search&quot;, &quot;shortcut&quot;: &quot;⌘K&quot;, &quot;isInline&quot;: true}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">In place</span><div style="padding-top:36px"><span data-nk="{&quot;$c&quot;: &quot;Tooltip&quot;, &quot;p&quot;: {&quot;content&quot;: &quot;Attach a file&quot;, &quot;isOpen&quot;: true, &quot;placement&quot;: &quot;top&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;IconButton&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Attach a file&quot;, &quot;icon&quot;: &quot;paperclip&quot;, &quot;variant&quot;: &quot;ghost&quot;, &quot;forceState&quot;: &quot;hover&quot;}}}}" style="display:contents"></span></div></div></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
