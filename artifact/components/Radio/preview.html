<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radio · preview</title>

</head>
<body>
<div class="sn-stage"><div class="sn-matrix" style="grid-template-columns:max-content repeat(5,max-content)"><span></span><span class="sn-cap">Default</span><span class="sn-cap">Hover</span><span class="sn-cap">Focus</span><span class="sn-cap">Error</span><span class="sn-cap">Disabled</span><span class="sn-matrix__row">Unselected</span><div><label class="sn-radio"><input type="radio" name="m-Unselected-Default"><span>Everyday</span></label></div><div><label class="sn-radio is-hover"><input type="radio" name="m-Unselected-Hover"><span>Everyday</span></label></div><div><label class="sn-radio is-focus"><input type="radio" name="m-Unselected-Focus"><span>Everyday</span></label></div><div><label class="sn-radio is-error sn-check--error"><input type="radio" name="m-Unselected-Error"><span>Everyday</span></label></div><div><label class="sn-radio"><input type="radio" name="m-Unselected-Disabled" disabled><span>Everyday</span></label></div><span class="sn-matrix__row">Selected</span><div><label class="sn-radio"><input type="radio" name="m-Selected-Default" checked><span>Everyday</span></label></div><div><label class="sn-radio is-hover"><input type="radio" name="m-Selected-Hover" checked><span>Everyday</span></label></div><div><label class="sn-radio is-focus"><input type="radio" name="m-Selected-Focus" checked><span>Everyday</span></label></div><div><label class="sn-radio is-error sn-check--error"><input type="radio" name="m-Selected-Error" checked><span>Everyday</span></label></div><div><label class="sn-radio"><input type="radio" name="m-Selected-Disabled" checked disabled><span>Everyday</span></label></div></div><span class="sn-cap">Group</span><fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="sn-field__label" style="margin-bottom:8px">Reading level</legend><label class="sn-radio"><input type="radio" name="grp-Sim"><span>Simple<small>Short sentences, no jargon.</small></span></label><label class="sn-radio"><input type="radio" name="grp-Eve" checked><span>Everyday<small>How a friend would explain it.</small></span></label><label class="sn-radio"><input type="radio" name="grp-Inf"><span>Informed<small>Keeps the legal terms, explains them.</small></span></label></fieldset></div>

</body>
</html>
