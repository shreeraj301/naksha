yday&quot;, &quot;children&quot;: &quot;Everyday&quot;}}, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><span class="nk-matrix__row">Selected</span><div><span data-nk="{&quot;$c&quot;: &quot;RadioGroup&quot;, &quot;p&quot;: {&quot;aria-label&quot;: &quot;Reading level&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;everyday&quot;, &quot;children&quot;: &quot;Everyday&quot;}}, &quot;defaultValue&quot;: &quot;everyday&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;RadioGroup&quot;, &quot;p&quot;: {&quot;aria-label&quot;: &quot;Reading level&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;everyday&quot;, &quot;children&quot;: &quot;Everyday&quot;, &quot;forceState&quot;: &quot;hover&quot;}}, &quot;defaultValue&quot;: &quot;everyday&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;RadioGroup&quot;, &quot;p&quot;: {&quot;aria-label&quot;: &quot;Reading level&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;everyday&quot;, &quot;children&quot;: &quot;Everyday&quot;, &quot;forceState&quot;: &quot;focus&quot;}}, &quot;defaultValue&quot;: &quot;everyday&quot;}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;RadioGroup&quot;, &quot;p&quot;: {&quot;aria-label&quot;: &quot;Reading level&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;everyday&quot;, &quot;children&quot;: &quot;Everyday&quot;}}, &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;isInvalid&quot;: true}}" style="display:contents"></span></div><div><span data-nk="{&quot;$c&quot;: &quot;RadioGroup&quot;, &quot;p&quot;: {&quot;aria-label&quot;: &quot;Reading level&quot;, &quot;children&quot;: {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;everyday&quot;, &quot;children&quot;: &quot;Everyday&quot;}}, &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div></div><span class="nk-cap">Group</span><span data-nk="{&quot;$c&quot;: &quot;RadioGroup&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;children&quot;: [{&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;simple&quot;, &quot;children&quot;: &quot;Simple&quot;, &quot;description&quot;: &quot;Short sentences, no jargon.&quot;}}, {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;everyday&quot;, &quot;children&quot;: &quot;Everyday&quot;, &quot;description&quot;: &quot;How a friend would explain it.&quot;}}, {&quot;$c&quot;: &quot;Radio&quot;, &quot;p&quot;: {&quot;value&quot;: &quot;informed&quot;, &quot;children&quot;: &quot;Informed&quot;, &quot;description&quot;: &quot;Keeps the legal terms, explains them.&quot;}}]}}" style="display:contents"></span></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object' && v.$c) return el(v); return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
