<!doctype html>

<meta charset="utf-8">
<title>ChatMessage · preview</title>

<body>
<div class="nk-stage" style="gap:32px;max-width:720px"><span data-nk="{&quot;$c&quot;: &quot;Thread&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Conversation with garu&quot;, &quot;children&quot;: [{&quot;$c&quot;: &quot;ChatMessage&quot;, &quot;p&quot;: {&quot;from&quot;: &quot;user&quot;, &quot;children&quot;: &quot;Explain clause 4.2 like I have never signed a lease before.&quot;}}, {&quot;$c&quot;: &quot;ChatMessage&quot;, &quot;p&quot;: {&quot;from&quot;: &quot;assistant&quot;, &quot;name&quot;: &quot;garu&quot;, &quot;status&quot;: &quot;AI · reads your sources&quot;, &quot;children&quot;: [&quot;clause 4.2 says the rent can go up once a year, by no more than 5%.&quot;, {&quot;$c&quot;: &quot;Cite&quot;, &quot;p&quot;: {&quot;n&quot;: 1}}, &quot; the landlord has to tell you in writing 30 days before.&quot;, {&quot;$c&quot;: &quot;Cite&quot;, &quot;p&quot;: {&quot;n&quot;: 2}}, &quot; if they skip the notice, the old rent stays.&quot;], &quot;sources&quot;: [{&quot;label&quot;: &quot;Schedule A, clause 4.2&quot;, &quot;onPress&quot;: &quot;$noop&quot;}, {&quot;label&quot;: &quot;Page 3, notice period&quot;, &quot;onPress&quot;: &quot;$noop&quot;}], &quot;onCopy&quot;: &quot;$noop&quot;, &quot;onFeedback&quot;: &quot;$noop&quot;, &quot;onRetry&quot;: &quot;$noop&quot;}}, {&quot;$c&quot;: &quot;ChatMessage&quot;, &quot;p&quot;: {&quot;from&quot;: &quot;assistant&quot;, &quot;name&quot;: &quot;garu&quot;, &quot;state&quot;: &quot;streaming&quot;, &quot;children&quot;: &quot;the deposit is two months of rent. you get it back within 30 days of leaving, minus&quot;}}, {&quot;$c&quot;: &quot;ChatMessage&quot;, &quot;p&quot;: {&quot;from&quot;: &quot;assistant&quot;, &quot;name&quot;: &quot;garu&quot;, &quot;state&quot;: &quot;error&quot;, &quot;error&quot;: &quot;garu lost the thread halfway. nothing was saved.&quot;, &quot;onRetry&quot;: &quot;$noop&quot;}}]}}" style="display:contents"></span></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
