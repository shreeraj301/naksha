<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Textarea · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-grid" style="grid-template-columns:repeat(2,minmax(260px,340px))"><div class="nk-cell"><span class="nk-cap">Default</span><span data-nk="{&quot;$c&quot;: &quot;Textarea&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Paste the paper&quot;, &quot;maxLength&quot;: 6000, &quot;placeholder&quot;: &quot;Paste a contract, a paper or a policy.&quot;, &quot;description&quot;: &quot;We never store what you paste.&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Focus</span><span data-nk="{&quot;$c&quot;: &quot;Textarea&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Paste the paper&quot;, &quot;maxLength&quot;: 6000, &quot;defaultValue&quot;: &quot;This Agreement is made between the Company and the Contractor. The Contractor agrees to deliver the services in Schedule A.&quot;, &quot;description&quot;: &quot;We never store what you paste.&quot;, &quot;forceState&quot;: &quot;focus&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Error</span><span data-nk="{&quot;$c&quot;: &quot;Textarea&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Paste the paper&quot;, &quot;maxLength&quot;: 6000, &quot;defaultValue&quot;: &quot;Hi&quot;, &quot;isInvalid&quot;: true, &quot;errorMessage&quot;: &quot;Paste at least one full paragraph.&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Disabled</span><span data-nk="{&quot;$c&quot;: &quot;Textarea&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Paste the paper&quot;, &quot;maxLength&quot;: 6000, &quot;placeholder&quot;: &quot;Paste a contract, a paper or a policy.&quot;, &quot;isDisabled&quot;: true, &quot;description&quot;: &quot;Reading the last paper. One moment.&quot;}}" style="display:contents"></span></div></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object' && v.$c) return el(v); return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
