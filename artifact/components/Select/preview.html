<!doctype html>

<meta charset="utf-8">
<title>Select · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-grid" style="grid-template-columns:repeat(3,minmax(200px,260px))"><div class="nk-cell"><span class="nk-cap">Default</span><span data-nk="{&quot;$c&quot;: &quot;Select&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;description&quot;: &quot;You can change this per paper.&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Hover</span><span data-nk="{&quot;$c&quot;: &quot;Select&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;description&quot;: &quot;You can change this per paper.&quot;, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Error</span><span data-nk="{&quot;$c&quot;: &quot;Select&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;placeholder&quot;: &quot;Choose a level&quot;, &quot;isInvalid&quot;: true, &quot;errorMessage&quot;: &quot;Pick a reading level.&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Disabled</span><span data-nk="{&quot;$c&quot;: &quot;Select&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Open</span><span data-nk="{&quot;$c&quot;: &quot;Select&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;options&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;defaultValue&quot;: &quot;everyday&quot;, &quot;forceState&quot;: &quot;open&quot;}}" style="display:contents"></span></div></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object' && v.$c) return el(v); return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
