<div class="sn-stage sn-scrim" style="padding:40px;flex-direction:row;flex-wrap:wrap;gap:24px;align-items:flex-start"><div class="sn-modal" role="dialog" aria-modal="true" aria-labelledby="m-default"><div class="sn-modal__head"><h2 class="sn-modal__title" id="m-default">Agree to this change?</h2><button class="sn-iconbtn sn-iconbtn--ghost sn-iconbtn--sm" aria-label="Close"><svg class="sn-i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg></button></div><div class="sn-modal__body"><p>The rent moves up by 5% from 1 January. Both of you need to agree before it applies.</p></div><div class="sn-modal__foot"><button type="button" class="sn-btn sn-btn--secondary"><span>Not now</span></button><button type="button" class="sn-btn sn-btn--primary"><span>Agree to this change</span></button></div></div><div class="sn-modal" role="dialog" aria-modal="true" aria-labelledby="m-danger"><div class="sn-modal__head"><h2 class="sn-modal__title" id="m-danger">Cancel this subscription?</h2><button class="sn-iconbtn sn-iconbtn--ghost sn-iconbtn--sm" aria-label="Close"><svg class="sn-i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg></button></div><div class="sn-modal__body"><p>You keep access until 18 December. After that your playlists stay, but downloads are removed. You can restart any time.</p></div><div class="sn-modal__foot"><button type="button" class="sn-btn sn-btn--secondary"><span>Keep it</span></button><button type="button" class="sn-btn sn-btn--danger"><span>Cancel subscription</span></button></div></div></div>
