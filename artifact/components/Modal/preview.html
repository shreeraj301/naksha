<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal · preview</title>

</head>
<body>
<div class="nk-stage nk-scrim" style="padding:40px;flex-direction:row;flex-wrap:wrap;gap:24px;align-items:flex-start"><span data-nk="{&quot;$c&quot;: &quot;Modal&quot;, &quot;p&quot;: {&quot;isInline&quot;: true, &quot;title&quot;: &quot;Agree to this change?&quot;, &quot;children&quot;: &quot;The rent moves up by 5% from 1 January. Both of you need to agree before it applies.&quot;, &quot;footer&quot;: [{&quot;$c&quot;: &quot;Button&quot;, &quot;p&quot;: {&quot;variant&quot;: &quot;secondary&quot;, &quot;children&quot;: &quot;Not now&quot;}}, {&quot;$c&quot;: &quot;Button&quot;, &quot;p&quot;: {&quot;variant&quot;: &quot;primary&quot;, &quot;children&quot;: &quot;Agree to this change&quot;}}]}}" style="display:contents"></span><span data-nk="{&quot;$c&quot;: &quot;Modal&quot;, &quot;p&quot;: {&quot;isInline&quot;: true, &quot;title&quot;: &quot;Cancel this subscription?&quot;, &quot;children&quot;: &quot;You keep access until 18 December. After that your playlists stay, but downloads are removed. You can restart any time.&quot;, &quot;footer&quot;: [{&quot;$c&quot;: &quot;Button&quot;, &quot;p&quot;: {&quot;variant&quot;: &quot;secondary&quot;, &quot;children&quot;: &quot;Keep it&quot;}}, {&quot;$c&quot;: &quot;Button&quot;, &quot;p&quot;: {&quot;variant&quot;: &quot;danger&quot;, &quot;children&quot;: &quot;Cancel subscription&quot;}}]}}" style="display:contents"></span></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
