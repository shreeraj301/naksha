<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DropdownMenu · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-row nk-row--top" style="gap:40px"><span data-nk="{&quot;$c&quot;: &quot;DropdownMenu&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Paper actions&quot;, &quot;items&quot;: [{&quot;id&quot;: &quot;copy&quot;, &quot;label&quot;: &quot;Copy link&quot;, &quot;icon&quot;: &quot;link&quot;, &quot;shortcut&quot;: &quot;⌘C&quot;}, {&quot;id&quot;: &quot;rename&quot;, &quot;label&quot;: &quot;Rename&quot;, &quot;icon&quot;: &quot;pencil&quot;, &quot;shortcut&quot;: &quot;R&quot;}, {&quot;id&quot;: &quot;open&quot;, &quot;label&quot;: &quot;Open in new tab&quot;, &quot;icon&quot;: &quot;external-link&quot;, &quot;shortcut&quot;: &quot;⌘↵&quot;}, {&quot;id&quot;: &quot;duplicate&quot;, &quot;label&quot;: &quot;Duplicate&quot;, &quot;icon&quot;: &quot;copy&quot;, &quot;isDisabled&quot;: true}, {&quot;separator&quot;: true}, {&quot;id&quot;: &quot;delete&quot;, &quot;label&quot;: &quot;Delete&quot;, &quot;icon&quot;: &quot;trash-2&quot;, &quot;shortcut&quot;: &quot;⌫&quot;, &quot;isDanger&quot;: true}], &quot;isInline&quot;: true, &quot;forceHover&quot;: &quot;rename&quot;}}" style="display:contents"></span><span data-nk="{&quot;$c&quot;: &quot;DropdownMenu&quot;, &quot;p&quot;: {&quot;label&quot;: &quot;Reading level&quot;, &quot;title&quot;: &quot;Reading level&quot;, &quot;items&quot;: [{&quot;id&quot;: &quot;simple&quot;, &quot;label&quot;: &quot;Simple&quot;}, {&quot;id&quot;: &quot;everyday&quot;, &quot;label&quot;: &quot;Everyday&quot;}, {&quot;id&quot;: &quot;informed&quot;, &quot;label&quot;: &quot;Informed&quot;}], &quot;selectionMode&quot;: &quot;single&quot;, &quot;defaultSelectedKey&quot;: &quot;everyday&quot;, &quot;isInline&quot;: true}}" style="display:contents"></span></div></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
