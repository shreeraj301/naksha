<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link · preview</title>

</head>
<body>
<div class="nk-stage"><div class="nk-grid" style="grid-template-columns:repeat(4,max-content)"><div class="nk-cell"><span class="nk-cap">Default</span><span data-nk="{&quot;$c&quot;: &quot;Link&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Read the case study&quot;, &quot;href&quot;: &quot;#&quot;, &quot;iconEnd&quot;: &quot;arrow-right&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Hover</span><span data-nk="{&quot;$c&quot;: &quot;Link&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Read the case study&quot;, &quot;href&quot;: &quot;#&quot;, &quot;iconEnd&quot;: &quot;arrow-right&quot;, &quot;forceState&quot;: &quot;hover&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Focus</span><span data-nk="{&quot;$c&quot;: &quot;Link&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Read the case study&quot;, &quot;href&quot;: &quot;#&quot;, &quot;iconEnd&quot;: &quot;arrow-right&quot;, &quot;forceState&quot;: &quot;focus&quot;}}" style="display:contents"></span></div><div class="nk-cell"><span class="nk-cap">Disabled</span><span data-nk="{&quot;$c&quot;: &quot;Link&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;Read the case study&quot;, &quot;isDisabled&quot;: true}}" style="display:contents"></span></div></div><span class="nk-cap">Inline in body-l</span><p class="body-l" style="margin:0;max-width:56ch">Ledger explains every charge before you have to ask. I tested it with 15 people; the <span data-nk="{&quot;$c&quot;: &quot;Link&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;research notes&quot;, &quot;href&quot;: &quot;#&quot;}}" style="display:contents"></span> show where the first version lost them, and the <span data-nk="{&quot;$c&quot;: &quot;Link&quot;, &quot;p&quot;: {&quot;children&quot;: &quot;full report&quot;, &quot;href&quot;: &quot;#&quot;, &quot;variant&quot;: &quot;muted&quot;}}" style="display:contents"></span> is on Notion.</p></div>
<script>
/* Mount live Naksha components: each [data-nk] is {"$c": name, "p": props}. "$noop" becomes a no-op handler,
   nested {"$c": ...} values become elements, and "spec" puts a redline target on the rendered element. */
(function(){
  var h = React.createElement;
  function val(v){ if (v === '$noop') return function(){}; if (Array.isArray(v)) return v.map(val); if (v && typeof v === 'object') { if (v.$c) return el(v); if (v.$html) return h('div', { style: { height: '100%' }, dangerouslySetInnerHTML: { __html: v.$html } }); var o = {}; for (var k in v) o[k] = val(v[k]); return o; } return v; }
  function el(s){ var p = {}; for (var k in (s.p || {})) p[k] = val(s.p[k]); return h(Naksha[s.$c], p); }
  document.querySelectorAll('[data-nk]').forEach(function(node){
    var s = JSON.parse(node.getAttribute('data-nk'));
    ReactDOM.flushSync(function(){ ReactDOM.createRoot(node).render(el(s)); });
    if (s.spec) { var t = s.specTarget ? node.querySelector(s.specTarget) : node.firstElementChild; if (t) t.setAttribute('data-spec', s.spec); }
  });
})();
</script>
</body>
</html>
