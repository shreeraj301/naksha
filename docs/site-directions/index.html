<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naksha site directions</title>
<link rel="stylesheet" href="../../dist/css/naksha.css">
<link rel="stylesheet" href="../../dist/css/components.css">
<script src="../../dist/artifact/components/lib/react.production.min.js"></script>
<script src="../../dist/artifact/components/lib/react-dom.production.min.js"></script>
<script src="../../dist/artifact/components/bundle.js"></script>
<style>
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:#0b0b0a;color:#ece8e0;font-family:var(--font-sans);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.chrome{display:flex;flex-wrap:nowrap;align-items:center;gap:var(--space-16);padding:var(--space-12) var(--space-20);border-bottom:1px solid #2b2926}
.chrome h1{white-space:nowrap;margin:0 var(--space-8) 0 0;font-family:var(--font-display);font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:.01em}
.grp{display:flex;border:1px solid #4a4743}
.grp button{appearance:none;border:0;background:transparent;color:#a7a196;font:inherit;font-size:.875rem;padding:var(--space-8) var(--space-12);cursor:pointer;transition:background-color 150ms ease,color 150ms ease}
.grp button+button{border-left:1px solid #4a4743}
.grp button:hover{color:#ece8e0;background:#1f1d1b}
.grp button[aria-pressed=true]{background:#ece8e0;color:#151413}
.grp button b{font-family:var(--font-mono);font-weight:500;margin-right:6px}
.grp button:focus-visible,.open:focus-visible{outline:2px solid #e2c463;outline-offset:2px}
.sp{flex:1}
.note{flex:1;min-width:0;font-size:.8125rem;color:#a7a196;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{color:#ece8e0;font-size:.875rem;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.stage{position:relative;display:grid;place-items:center;overflow:auto;background:#151413}
.stage iframe{border:0;background:#fff;display:block;width:100%;height:100%;transition:width 280ms cubic-bezier(.16,1,.3,1),height 280ms cubic-bezier(.16,1,.3,1)}
.stage.phone{padding:var(--space-24)}
.stage.phone iframe{width:390px;height:min(844px,calc(100% - 8px));outline:1px solid #4a4743;outline-offset:8px}
.keys{font-family:var(--font-mono);font-size:.75rem;color:#7a756d}
</style>
</head>
<body>
<header class="chrome"><h1>Naksha directions</h1>
<div class="grp" role="group" aria-label="Direction"><button data-d="a" aria-pressed="true"><b>A</b>Elastic</button><button data-d="b" aria-pressed="false"><b>B</b>Ask Naksha</button><button data-d="c" aria-pressed="false"><b>C</b>Seven fields</button></div>
<div class="grp" role="group" aria-label="Page"><button data-p="home" aria-pressed="true">Home</button><button data-p="button" aria-pressed="false">Button page</button></div>
<div class="grp" role="group" aria-label="Device"><button data-v="desktop" aria-pressed="true">Desktop</button><button data-v="phone" aria-pressed="false">Phone</button></div>
<span class="note" id="note"></span><a class="open" id="open" href="a-elastic.html" target="_blank" rel="noopener">Open full page</a></header>
<main class="stage" id="stage"><iframe id="frame" title="Direction preview" src="a-elastic.html"></iframe></main>
<script>
(function () {
  var FILES = { a: ["a-elastic.html", "a-elastic-button.html"], b: ["b-ask.html", "b-ask-button.html"], c: ["c-fields.html", "c-fields-button.html"] };
  var NOTES = { a: "Dark. The name breathes on the width axis; every component name fills the page. Move the pointer across NAKSHA.",
    b: "Dark. The home page builds interface from Naksha's own AI components. Pick a suggestion or type a request.",
    c: "Light. Seven colour bands, then the page turns each group's colour as you scroll. Point at a band." };
  var st = { d: "a", p: "home", v: "desktop" };
  try { var h = location.hash.slice(1).split("-"); if (FILES[h[0]]) st = { d: h[0], p: h[1] === "button" ? "button" : "home", v: h[2] === "phone" ? "phone" : "desktop" }; } catch (e) {}
  var frame = document.getElementById("frame"), stage = document.getElementById("stage"), open = document.getElementById("open"), note = document.getElementById("note");
  function render() {
    var url = FILES[st.d][st.p === "home" ? 0 : 1];
    if (frame.getAttribute("src") !== url) frame.setAttribute("src", url);
    open.href = url; note.textContent = NOTES[st.d]; stage.classList.toggle("phone", st.v === "phone");
    document.querySelectorAll("[data-d]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.d === st.d); });
    document.querySelectorAll("[data-p]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.p === st.p); });
    document.querySelectorAll("[data-v]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === st.v); });
    try { history.replaceState(null, "", "#" + st.d + "-" + st.p + "-" + st.v); } catch (e) {}
  }
  document.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; if (b.dataset.d) st.d = b.dataset.d; if (b.dataset.p) st.p = b.dataset.p; if (b.dataset.v) st.v = b.dataset.v; render(); });
  document.addEventListener("keydown", function (e) { if (e.target.closest("input, textarea")) return; var k = e.key.toLowerCase(), m = { "1": ["d", "a"], "2": ["d", "b"], "3": ["d", "c"], h: ["p", "home"], b: ["p", "button"], d: ["v", "desktop"], p: ["v", "phone"] }[k]; if (m) { st[m[0]] = m[1]; render(); } });
  render();
})();
</script>
</body>
</html>
