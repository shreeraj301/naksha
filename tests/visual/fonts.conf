<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Pins font rendering for the screenshot tests so every Linux machine draws the same pixels.
     Only Inter is visible as a system font: it draws the few glyphs no Naksha font has (⌘ ↵ ⇧ ⌫).
     Grayscale antialiasing, no hinting, no subpixel colour. -->
<fontconfig>
  <dir>/usr/share/fonts/opentype/inter</dir>
  <cachedir prefix="xdg">fontconfig-naksha</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
