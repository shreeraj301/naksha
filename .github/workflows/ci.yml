name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:skill
      - uses: actions/upload-artifact@v4
        with:
          name: naksha-dist
          path: dist/
          retention-days: 30

  visual:
    # Screenshots of every artifact preview (light, dark, forced colours), axe on each,
    # plus reduced-motion and cascade-layer checks. Baselines were made on Ubuntu 24.04
    # with Playwright 1.63.0. tests/visual/fonts.conf pins font rendering, and fonts-inter
    # draws the ⌘ ↵ ⇧ ⌫ glyphs no Naksha font has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual
      - if: failure()
        run: |
          lscpu | grep -E "Model name|Flags" | cut -c1-200
          pip install --quiet pillow numpy && python3 tests/visual/diff_report.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14

  site:
    # The website gates (tests/site, ADR 0013): every page in light and dark with reduced motion on, against saved
    # screenshots, plus clipped text, console errors, axe at every severity and reflow at 320px. Issues that exist
    # today are listed in tests/site/known-issues.json; anything else fails, and so does a listed issue that is gone.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm ci && npm run build
        working-directory: site
      - run: npm run test:site
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-diffs
          path: test-results/
          retention-days: 14
